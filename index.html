<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>雨夜·窗外</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0a0e1a;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
    cursor: crosshair;
  }

  #scene {
    position: fixed;
    inset: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #0a0e1a 0%, #141a2e 40%, #1c2238 70%, #232a44 100%);
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    animation: twinkle 2s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  #moon {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 60px;
    height: 60px;
    background: #f5f5dc;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(245,245,220,0.4), inset -10px -5px 0 #d4d4a8;
  }

  #city {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 55%;
  }
  .building {
    position: absolute;
    bottom: 0;
    background: #0d1020;
    border-top: 3px solid #1a1f35;
  }
  .window-light {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ffd966;
    box-shadow: 0 0 4px rgba(255,217,102,0.6);
    animation: lightBlink 3s infinite;
  }
  @keyframes lightBlink {
    0%, 90%, 100% { opacity: 1; }
    95% { opacity: 0.2; }
  }

  /* 雨水层：整体旋转实现斜雨 + 随风改变角度 */
  #rain-layer {
    position: absolute;
    inset: -25%;
    transform: rotate(10deg);
    transition: transform 2.5s ease-in-out;
    pointer-events: none;
  }
  .raindrop {
    position: absolute;
    width: 2px;
    background: linear-gradient(to bottom, transparent, rgba(174,194,224,0.7));
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-120vh); }
    100% { transform: translateY(120vh); }
  }

  #window-frame {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  .frame-bar {
    position: absolute;
    background: #2a1810;
    box-shadow: inset 0 0 0 2px #1a0f08, inset 2px 2px 0 #3d2418;
  }
  .frame-top    { top: 0; left: 0; right: 0; height: 40px; }
  .frame-bottom { bottom: 0; left: 0; right: 0; height: 40px; }
  .frame-left   { top: 0; bottom: 0; left: 0; width: 40px; }
  .frame-right  { top: 0; bottom: 0; right: 0; width: 40px; }
  .frame-mid-h  { top: 50%; left: 40px; right: 40px; height: 12px; transform: translateY(-50%); }
  .frame-mid-v  { left: 50%; top: 40px; bottom: 40px; width: 12px; transform: translateX(-50%); }

  .condensation {
    position: absolute;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    pointer-events: none;
    z-index: 40;
  }

  .bubble {
    position: absolute;
    background: var(--bg, #1a1a2e);
    border: 3px solid var(--c, #ff6b9d);
    padding: 14px 24px;
    color: var(--t, #ffe4ec);
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    white-space: nowrap;
    z-index: 100;
    animation: bubblePop 3s ease-out forwards;
    pointer-events: none;
    box-shadow: 0 0 0 2px var(--bg, #1a1a2e), 0 0 20px var(--glow, rgba(255,107,157,0.5));
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 20px;
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 14px solid var(--c, #ff6b9d);
  }
  .bubble::before {
    content: '';
    position: absolute;
    bottom: -9px;
    left: 23px;
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 10px solid var(--bg, #1a1a2e);
    z-index: 1;
  }
  @keyframes bubblePop {
    0%   { opacity: 0; transform: scale(0.3) translateY(10px); }
    15%  { opacity: 1; transform: scale(1.15) translateY(-5px); }
    25%  { transform: scale(1) translateY(0); }
    80%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-30px) scale(0.95); }
  }

  .ripple {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,107,157,0.6);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
    animation: rippleExpand 0.6s ease-out forwards;
  }
  @keyframes rippleExpand {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(0.3); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(3); }
  }

  /* 安慰彩蛋：整屏中央渐显，非气泡 */
  #comfort-egg {
    position: fixed;
    inset: 0;
    background: rgba(10,14,26,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2.5s ease-in-out;
    padding: 40px;
    backdrop-filter: blur(2px);
  }
  #comfort-egg.show { opacity: 1; }
  #comfort-egg .wrap {
    max-width: 560px;
    text-align: center;
  }
  #comfort-egg .text {
    color: #ffe4ec;
    font-size: 20px;
    line-height: 2.2;
    letter-spacing: 2px;
    text-shadow: 0 0 16px rgba(255,107,157,0.55);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 3s ease, transform 3s ease;
  }
  #comfort-egg.show .text {
    opacity: 1;
    transform: translateY(0);
  }
  #comfort-egg .sig {
    margin-top: 28px;
    font-size: 14px;
    color: #ff9ac4;
    letter-spacing: 3px;
    opacity: 0;
    transition: opacity 2s ease 1s;
  }
  #comfort-egg.show .sig { opacity: 0.9; }

  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    z-index: 200;
    pointer-events: none;
    letter-spacing: 1px;
  }
</style>
</head>

/* ============ 星星 ============ */
const sky = document.getElementById('sky');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 40 + '%';
  s.style.animationDelay = Math.random() * 2 + 's';
  s.style.opacity = Math.random() * 0.7 + 0.3;
  sky.appendChild(s);
}

/* ============ 城市建筑 ============ */
const city = document.getElementById('city');
const buildingCount = 14;
const windowColors = ['#ffd966', '#ff9a76', '#a0e7ff', '#ffd1dc', '#b4f4c4'];
for (let i = 0; i < buildingCount; i++) {
  const b = document.createElement('div');
  b.className = 'building';
  const w = 60 + Math.random() * 80;
  const h = 100 + Math.random() * 300;
  b.style.width = w + 'px';
  b.style.height = h + 'px';
  b.style.left = (i * (100 / buildingCount)) + '%';
  const cols = Math.floor(w / 12);
  const rows = Math.floor(h / 14);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() > 0.55) continue;
      const light = document.createElement('div');
      light.className = 'window-light';
      light.style.left = (c * 12 + 4) + 'px';
      light.style.top = (r * 14 + 6) + 'px';
      light.style.background = windowColors[Math.floor(Math.random() * windowColors.length)];
      light.style.animationDelay = Math.random() * 3 + 's';
      b.appendChild(light);
    }
  }
  city.appendChild(b);
}

/* ============ 斜雨 + 风 ============ */
const rainLayer = document.getElementById('rain-layer');
const rainCount = 150;
for (let i = 0; i < rainCount; i++) {
  const drop = document.createElement('div');
  drop.className = 'raindrop';
  drop.style.left = Math.random() * 100 + '%';
  drop.style.height = (12 + Math.random() * 22) + 'px';
  drop.style.animationDuration = (0.4 + Math.random() * 0.6) + 's';
  drop.style.animationDelay = Math.random() * 2 + 's';
  drop.style.opacity = 0.3 + Math.random() * 0.4;
  rainLayer.appendChild(drop);
}
function changeWind() {
  const angle = Math.random() * 50 - 25;
  rainLayer.style.transform = `rotate(${angle}deg)`;
  setTimeout(changeWind, 4000 + Math.random() * 6000);
}
changeWind();

/* ============ 玻璃水珠 ============ */
for (let i = 0; i < 50; i++) {

  drop.style.height = size + 'px';
  drop.style.left = Math.random() * 100 + '%';
  drop.style.top = Math.random() * 100 + '%';

/* ============ 气泡不重复随机 ============ */
let shuffled = [];
let pointer = 0;
function reshuffle() {
  shuffled = [...bubbleTexts].sort(() => Math.random() - 0.5);
  pointer = 0;
}
reshuffle();

/* ============ 安慰彩蛋概率机制：每50次点击至少1次、至多2次 ============ */
let cycleClicks = 0;
let eggPositions = [];
let eggShown = false; // 当前这次点击是否触发了彩蛋
function startNewCycle() {
  cycleClicks = 0;
  // 随机决定本轮出现1次还是2次
  const eggCount = Math.random() < 0.6 ? 1 : 2;
  const pool = Array.from({ length: 50 }, (_, i) => i);
  eggPositions = [];
  for (let i = 0; i < eggCount; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    eggPositions.push(pool.splice(idx, 1)[0]);
  }
}
startNewCycle();

/* ============ 安慰彩蛋展示（整屏中央渐显） ============ */
const egg = document.getElementById('comfort-egg');
const comfortText = document.getElementById('comfort-text');
let eggActive = false;

function showComfort() {
  if (eggActive) return;
  eggActive = true;
  const text = comfortTexts[Math.floor(Math.random() * comfortTexts.length)];
  comfortText.textContent = text;
  egg.classList.add('show');
  setTimeout(() => {
    egg.classList.remove('show');
    setTimeout(() => { eggActive = false; }, 3000);
  }, 12000);
}

/* ============ 点击产生气泡 ============ */
document.addEventListener('click', (e) => {
  // 波纹
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.left = e.clientX + 'px';
  ripple.style.top = e.clientY + 'px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);

  // 彩蛋判定
  let triggerEgg = false;
  if (eggPositions.includes(cycleClicks)) {
    triggerEgg = true;
  }
  cycleClicks++;
  if (cycleClicks >= 50) startNewCycle();

  if (triggerEgg) {
    showComfort();
    return; // 触发彩蛋时不显示伤心气泡
  }

  // 取下一条伤心文案（不重复）
  const text = shuffled[pointer];
  pointer++;
  if (pointer >= shuffled.length) reshuffle();

  const offsetX = (Math.random() - 0.5) * 60;
  const offsetY = -40 - Math.random() * 40;
  const rot = (Math.random() - 0.5) * 10;

  const palette = warmPalettes[Math.floor(Math.random() * warmPalettes.length)];
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.setProperty('--c', palette.c);
  bubble.style.setProperty('--bg', palette.bg);
  bubble.style.setProperty('--t', palette.t);
  bubble.style.setProperty('--glow', palette.glow);
  bubble.textContent = text;
  bubble.style.left = (e.clientX + offsetX) + 'px';
  bubble.style.top = (e.clientY + offsetY) + 'px';
  bubble.style.transform = `rotate(${rot}deg)`;
  document.body.appendChild(bubble);
  setTimeout(() => bubble.remove(), 3000);
});
</script>
